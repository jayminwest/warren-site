version: 2
updates:
  # Dependency-update delay via Dependabot's `cooldown` block. Holds back PRs
  # for freshly published versions so the project does not auto-adopt a
  # release on day zero — gives the ecosystem (and the maintainer) time to
  # surface regressions before they land on main. Mirrors Renovate's
  # `minimumReleaseAge` behaviour. Closes the `min_release_age` criterion.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    ignore:
      # typescript is pinned to 5.x on purpose: @astrojs/check declares a peer
      # range of ^5.0.0 || ^6.0.0, so a major bump breaks `bun run typecheck`.
      # Dependabot proposed 7.0.2 on day one and CI correctly rejected it.
      # Drop this entry once @astrojs/check widens its peer range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    cooldown:
      default-days: 5
